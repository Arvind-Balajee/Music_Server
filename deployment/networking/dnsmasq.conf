# dnsmasq configuration for the MusicBox Wi-Fi access point.
#
# Installed to: /etc/dnsmasq.d/musicbox.conf
#   (a drop-in under dnsmasq.d/, NOT /etc/dnsmasq.conf itself — this leaves
#   the distro's default dnsmasq.conf, which is usually just
#   `conf-dir=/etc/dnsmasq.d/,*.conf`, untouched. install.sh installs it this
#   way; if you're wiring this up by hand, either drop it into dnsmasq.d/ or
#   `conf-file=` it from your main dnsmasq.conf.)
#
# Provides DHCP (and disabled-upstream DNS) for phones/laptops that associate
# with the MusicBox AP, per Plan.md §13: clients get addresses starting at
# 192.168.50.10, with 192.168.50.1 (the Pi itself) as gateway and DNS.
#
# NOT tested on real hardware. Reviewed against `man dnsmasq` / the shipped
# `dnsmasq.conf.example` rather than run through a live dnsmasq (not
# installed in this environment).

# Only listen/serve on the AP interface. Critical: without this, dnsmasq
# would also try to hand out addresses / answer DNS on any other interface
# (e.g. eth0 while syncing at home), which could fight with your home
# router's own DHCP server.
interface=wlan0
bind-interfaces
except-interface=lo
# Belt-and-suspenders: refuse to serve any interface other than wlan0 even if
# this file is ever merged with a broader dnsmasq.conf.
no-dhcp-interface=eth0

# --- DHCP ---------------------------------------------------------------

# Client pool: 192.168.50.10 - 192.168.50.200, /24, 12 hour lease.
# .2-.9 are left free on purpose for any statically-addressed accessories you
# might add later (e.g. a second SBC, a debug laptop) without colliding with
# DHCP-assigned phones.
dhcp-range=192.168.50.10,192.168.50.200,255.255.255.0,12h

# Gateway handed to clients = the Pi's own AP address.
dhcp-option=option:router,192.168.50.1

# DNS server handed to clients = the Pi itself (see "DNS" section below for
# what that actually resolves).
dhcp-option=option:dns-server,192.168.50.1

# Send an empty NTP option so clients don't sit around waiting for one that
# doesn't exist offline (harmless if a client ignores it either way).
# dhcp-option=option:ntp-server,192.168.50.1

# --- DNS ------------------------------------------------------------------

# This device is offline by design (Plan.md: "The network must function
# WITHOUT internet"). dnsmasq's DNS role here is intentionally minimal:
#   - it does NOT forward to any upstream resolver (there isn't one),
#   - it answers musicbox.local itself as a belt-and-suspenders alongside
#     Avahi/mDNS (see deployment/networking/musicbox.service and
#     docs/deployment.md's mDNS section) in case a client's mDNS resolver is
#     flaky — most clients should never actually need this because they'll
#     resolve musicbox.local via mDNS, not unicast DNS.
no-resolv
no-poll
address=/musicbox.local/192.168.50.1

# Answer authoritatively for the leases we hand out (quiets down retries from
# clients that assume a "real" DNS server is present).
dhcp-authoritative

# Don't let dnsmasq read /etc/hosts for its DNS answers (irrelevant on a
# purpose-built appliance, but keeps behavior predictable).
no-hosts

# --- Logging ----------------------------------------------------------------

# Cheap to leave on for a Pi; genuinely useful the first time you're
# debugging "why didn't my phone get an IP" on real hardware. View with
# `journalctl -u dnsmasq`. Comment out log-dhcp if it's too noisy long-term.
log-queries
log-dhcp
