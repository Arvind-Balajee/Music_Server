# NetworkManager drop-in: tell NetworkManager to leave wlan0 alone entirely.
#
# Installed to: /etc/NetworkManager/conf.d/musicbox-unmanaged.conf
#
# Only needed if you are using the classic hostapd.conf + dnsmasq.conf path
# on a NetworkManager-based OS (Raspberry Pi OS Bookworm+) instead of the
# native nm-musicbox-ap.nmconnection profile. If you're using
# nm-musicbox-ap.nmconnection, do NOT install this file — NetworkManager
# needs to manage wlan0 in that path.
#
# Without this, NetworkManager and hostapd will both try to control wlan0
# (NetworkManager scanning/attempting to associate it as a station interface
# while hostapd tries to run it as an AP), and one will win unpredictably.
#
# Reviewed against `man NetworkManager.conf` (the [keyfile] section);
# not tested on real hardware.
[keyfile]
unmanaged-devices=interface-name:wlan0
