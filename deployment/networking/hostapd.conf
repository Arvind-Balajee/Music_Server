# hostapd configuration for the MusicBox Wi-Fi access point.
#
# Installed to: /etc/hostapd/hostapd.conf
# Used by:      the standard `hostapd` package/systemd unit that ships with
#               Raspberry Pi OS (Debian). install.sh only copies this file and
#               points /etc/default/hostapd at it; it does not compile hostapd.
#
# Applies to:   Raspberry Pi OS "Bullseye" and earlier, where dhcpcd is the
#               network manager and wlan0 can be handed directly to hostapd.
#               On "Bookworm"+ (NetworkManager default) either mark wlan0
#               unmanaged first (see deployment/README.md), or skip this file
#               entirely and use the NetworkManager AP profile documented in
#               deployment/networking/nm-musicbox-ap.nmconnection instead —
#               don't run both against the same interface at once.
#
# NOT tested on real hardware (no Pi available in this environment). Reviewed
# against the hostapd.conf reference documentation (man hostapd.conf /
# hostapd's shipped `hostapd.conf` sample) rather than run through `hostapd -t`
# (not installed here).

# --- Radio ------------------------------------------------------------------

# Wireless interface hostapd will manage. This is the Pi's onboard Wi-Fi radio
# on all three target boards (Zero 2 W, 4, 5). If you're using a USB Wi-Fi
# adapter for the AP instead, change this to that adapter's interface name.
interface=wlan0

driver=nl80211

# --- Identity -----------------------------------------------------------

ssid=MusicBox

# 2.4 GHz (802.11g/n), channel 7.
#
# Chosen for maximum compatibility: the Raspberry Pi Zero 2 W's onboard radio
# (Cypress/Broadcom CYW43436) is 2.4 GHz-only, so hw_mode=g is the only choice
# that also works unmodified on that board. Pi 4 and Pi 5 both have dual-band
# (2.4/5 GHz, 802.11ac) radios and can do better throughput on 5 GHz — if you
# are deploying to only Pi 4/5 hardware and want higher throughput / less
# 2.4 GHz congestion, switch to:
#   hw_mode=a
#   channel=36
#   ieee80211ac=1
#   country_code=<your two-letter ISO code>   (required for 5 GHz legally)
# but note this will NOT work on a Pi Zero 2 W.
hw_mode=g
channel=7

# 802.11n (HT) on top of 802.11g. Meaningfully improves throughput for
# streaming FLAC over the AP and is supported by all three target boards.
ieee80211n=1
ht_capab=[HT40][SHORT-GI-20][DSSS_CCK-40]

# REQUIRED by hostapd for legal transmit power/channel limits. "US" is a
# placeholder — set this to the two-letter ISO 3166-1 country code where the
# device will actually operate before first boot, or the radio may refuse to
# start or operate out of regulatory compliance.
country_code=US
ieee80211d=1

# --- Access control / visibility --------------------------------------------

# 0 = broadcast the SSID (visible in Wi-Fi pickers). Set to 1 to hide it, but
# note that hiding the SSID is not a real security measure and makes initial
# phone pairing more annoying — left visible by default.
ignore_broadcast_ssid=0

# Max associated stations. MVP target is ~1 phone; a generous headroom of 8
# covers a driver + passengers each connecting, without leaving it unbounded.
max_num_sta=8

# --- Security: WPA2-PSK ------------------------------------------------------

wpa=2
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP
# wpa_pairwise (WPA1/TKIP cipher list) is deliberately omitted rather than
# set to an empty value: wpa=2 alone already means "WPA2 only", and an
# empty wpa_pairwise= is rejected by some hostapd builds instead of being
# treated as "none".

# CHANGE THIS BEFORE DEPLOYING. This is an example passphrase only.
# Must be 8-63 ASCII characters per the WPA2-PSK spec. install.sh will not
# generate one for you (there's no safe default); pick a real passphrase and
# edit this file (or set MUSICBOX_WIFI_PASSPHRASE before running
# install.sh --with-ap, see deployment/README.md) before first boot.
wpa_passphrase=ChangeMe-MusicBox-2024

# --- Misc ---------------------------------------------------------------

# Disable hostapd's built-in EAP server / WPS — not needed, smaller attack
# surface for a device that has no need to onboard unknown clients.
wps_state=0
eapol_key_index_workaround=0

# Logging (useful when bringing this up on real hardware for the first time;
# view with `journalctl -u hostapd` when run under systemd).
logger_syslog=-1
logger_syslog_level=2
logger_stdout=-1
logger_stdout_level=2
