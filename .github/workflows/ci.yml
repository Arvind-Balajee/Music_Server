name: CI

on:
  push:
    branches: [main, "agent/**"]
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install SQLite3 + TagLib + OpenSSL (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev libtag1-dev libssl-dev

      - name: Install TagLib + OpenSSL (macOS)
        if: runner.os == 'macOS'
        run: brew install taglib openssl@3

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build -j

      - name: Test
        run: ctest --test-dir build --output-on-failure

  sanitize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install SQLite3 + TagLib + OpenSSL
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev libtag1-dev libssl-dev

      - name: Configure (ASan + UBSan)
        run: cmake -S . -B build-asan -DCMAKE_BUILD_TYPE=Debug -DMUSICBOX_SANITIZE=address,undefined

      - name: Build
        run: cmake --build build-asan -j

      - name: Test
        run: ctest --test-dir build-asan --output-on-failure

  format-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned to an exact version rather than the runner's preinstalled
      # clang-format: formatting rules for some constructs (e.g. brace-init
      # `struct stat st{};`, empty compound statements) differ between
      # clang-format releases even with an identical .clang-format config,
      # which previously caused CI to flag lines that a locally up-to-date
      # clang-format considered already compliant.
      - name: Install pinned clang-format
        run: pip install --quiet clang-format==23.1.1

      - name: clang-format check
        run: |
          FILES=$(find server shared tests -name '*.cpp' -o -name '*.hpp' 2>/dev/null || true)
          if [ -n "$FILES" ]; then
            clang-format --dry-run --Werror $FILES
          else
            echo "No C++ sources yet."
          fi
