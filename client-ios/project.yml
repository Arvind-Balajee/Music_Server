name: MusicBox
options:
  bundleIdPrefix: com.arvindbalajee.musicbox
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_PREVIEWS: YES

targets:
  MusicBox:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: MusicBox
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.arvindbalajee.musicbox.app
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_CFBundleDisplayName: MusicBox
        INFOPLIST_KEY_UIBackgroundModes: audio
    info:
      path: MusicBox/Generated-Info.plist
      properties:
        UIBackgroundModes:
          - audio
        ITSAppUsesNonExemptEncryption: false
        NSLocalNetworkUsageDescription: "MusicBox connects to your MusicBox server over your local Wi-Fi network to browse and stream your music library."
        NSAppTransportSecurity:
          # The real ATS key for "allow plain HTTP to LAN IPs and .local
          # hostnames" is `NSAllowsLocalNetworking` -- `NSAllowsArbitraryLocalNetwork`
          # isn't an Apple key at all and silently does nothing. Without this,
          # plain HTTP to a literal IP (the server has no mDNS responder, so
          # "musicbox.local" never resolves) is blocked by ATS on a real
          # device; the Simulator enforces ATS more loosely, which is why this
          # went unnoticed until now.
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            musicbox.local:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: true

  MusicBoxTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: MusicBoxTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: MusicBox

schemes:
  MusicBox:
    build:
      targets:
        MusicBox: all
        MusicBoxTests: [test]
    test:
      targets:
        - MusicBoxTests
    run:
      config: Debug
